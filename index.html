<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>WebGIS AMAE - Rio Verde/GO</title>
	<meta name="description" content="Sistema de Informações Geográficas da AMAE - Agência Municipal de Água e Esgoto de Rio Verde/GO">
	<meta name="keywords" content="WebGIS, AMAE, Rio Verde, Goiás, Água, Esgoto, Mapa, Geografia">
	<meta name="author" content="AMAE Rio Verde">
	
	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://lucasaireseng.github.io/webgisamae/">
	<meta property="og:title" content="WebGIS AMAE - Rio Verde/GO">
	<meta property="og:description" content="Sistema de Informações Geográficas da AMAE">
	<meta property="og:image" content="https://lucasaireseng.github.io/webgisamae/LOGO/AMAEGIS.jpg">

	<!-- Twitter -->
	<meta property="twitter:card" content="summary_large_image">
	<meta property="twitter:url" content="https://lucasaireseng.github.io/webgisamae/">
	<meta property="twitter:title" content="WebGIS AMAE - Rio Verde/GO">
	<meta property="twitter:description" content="Sistema de Informações Geográficas da AMAE">
	<meta property="twitter:image" content="https://lucasaireseng.github.io/webgisamae/LOGO/AMAEGIS.jpg">
	
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<link rel="stylesheet" href="styles.css">
	
	<!-- Favicon -->
	<link rel="icon" type="image/jpeg" href="LOGO/AMAEGIS.jpg">
</head>
<body>
	<!-- Cabeçalho com logos -->
	<header id="header">
		<div class="header-content">
			<div class="logo-container">
				<img src="LOGO/LOGO RIO VERDE.png" alt="Logo Rio Verde" class="logo logo-rio-verde">
				<img src="LOGO/AMAEGIS.jpg" alt="Logo AMAEGIS" class="logo logo-amaegis">
			</div>
			<div class="header-title">
				<h1>WebGIS AMAE</h1>
				<p>Sistema de Informações Geográficas - Rio Verde/GO</p>
			</div>
		</div>
	</header>

	<!-- Barra lateral de camadas -->
	<div id="sidebar">
		<div class="sidebar-header">
			<h2>Camadas</h2>
			<button id="toggle-sidebar" class="toggle-btn">☰</button>
		</div>
		<div class="sidebar-content">
			<!-- Mapas de Fundo -->
			<div class="layer-group">
				<h3>Mapas de Fundo</h3>
				<div class="layer-controls">
					<label class="layer-item">
						<input type="radio" name="basemap" value="satellite" checked>
						<span class="layer-name">Google Satélite</span>
					</label>
					<label class="layer-item">
						<input type="radio" name="basemap" value="google">
						<span class="layer-name">Google Maps</span>
					</label>
					<label class="layer-item">
						<input type="radio" name="basemap" value="esri">
						<span class="layer-name">ESRI Satélite</span>
					</label>
				</div>
			</div>

			<!-- Camadas de Dados -->
			<div class="layer-group">
				<h3>Camadas de Dados</h3>
				<div class="layer-controls">
					<label class="layer-item">
						<input type="checkbox" id="layer-geral" checked>
						<span class="layer-name">GERAL</span>
						<span class="layer-color" style="background-color: #00cc66;"></span>
					</label>
					<label class="layer-item">
						<input type="checkbox" id="layer-agua">
						<span class="layer-name">ÁGUA</span>
						<span class="layer-color" style="background-color: #0066cc;"></span>
					</label>
					<label class="layer-item">
						<input type="checkbox" id="layer-esgoto">
						<span class="layer-name">ESGOTO</span>
						<span class="layer-color" style="background-color: #cc6600;"></span>
					</label>
					<label class="layer-item">
						<input type="checkbox" id="layer-bairros">
						<span class="layer-name">BAIRROS</span>
						<span class="layer-color" style="background-color: #0066cc;"></span>
					</label>
				</div>
			</div>

		</div>
	</div>

	<!-- Mapa -->
	<div id="map"></div>

	<!-- Footer -->
	<footer style="position: fixed; bottom: 0; right: 0; background: rgba(0,0,0,0.8); color: white; padding: 5px 10px; font-size: 12px; z-index: 1000;">
		AMAE Rio Verde/GO - WebGIS v1.0
	</footer>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="main.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>WebGIS AMAE - Leaflet</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<link rel="stylesheet" href="styles.css?v=20260918heat">
</head>
<body>
	<!-- Cabeçalho com logos -->
	<header id="header">
		<div class="header-content">
			<div class="logo-container">
				<img src="LOGO/LOGO RIO VERDE.png" alt="Logo Rio Verde" class="logo logo-rio-verde">
				<img src="LOGO/AMAEGIS.jpg" alt="Logo AMAEGIS" class="logo logo-amaegis">
			</div>
			<div class="header-title">
				<h1>WebGIS AMAE</h1>
				<p>Sistema de Informações Geográficas - Rio Verde/GO</p>
			</div>
			<a href="dashboard.html" class="header-action-btn" title="Abrir Dashboard da camada GERAL">Dashboard</a>
		</div>
	</header>

	<!-- Botão flutuante para abrir camadas no celular -->
	<button id="mobile-menu-btn" class="mobile-menu-btn" type="button" aria-label="Abrir camadas">☰</button>
	<div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

	<!-- Barra lateral de camadas -->
	<div id="sidebar" class="collapsed">
		<div class="sidebar-header">
			<h2>Camadas</h2>
			<button id="toggle-sidebar" class="toggle-btn" type="button" aria-label="Fechar camadas">☰</button>
		</div>
		<div class="sidebar-content">
			<div class="layer-group">
				<h3>Ferramentas</h3>
				<a href="dashboard.html" class="sidebar-link-btn">Dashboard</a>
			</div>

			<!-- Mapas de Fundo -->
			<div class="layer-group">
				<h3>Mapas de Fundo</h3>
				<div class="layer-controls">
					<label class="layer-item">
						<input type="radio" name="basemap" value="satellite" checked>
						<span class="layer-name">Google Satélite</span>
					</label>
					<label class="layer-item">
						<input type="radio" name="basemap" value="hybrid">
						<span class="layer-name">Google Hybrid</span>
					</label>
					<label class="layer-item">
						<input type="radio" name="basemap" value="google">
						<span class="layer-name">Google Maps</span>
					</label>
					<label class="layer-item">
						<input type="radio" name="basemap" value="esri">
						<span class="layer-name">ESRI Satélite</span>
					</label>
				</div>
			</div>

			<!-- Camadas de Dados -->
			<div class="layer-group">
				<h3>Camadas de Dados</h3>
				<div class="layer-controls">
					<label class="layer-item">
						<input type="checkbox" id="layer-geral" checked>
						<span class="layer-name">GERAL</span>
						<span class="layer-color" style="background-color: #00cc66;"></span>
					</label>
					<label class="layer-item">
						<input type="checkbox" id="layer-agua">
						<span class="layer-name">ÁGUA</span>
						<span class="layer-color" style="background-color: #0066cc;"></span>
					</label>
					<label class="layer-item">
						<input type="checkbox" id="layer-esgoto">
						<span class="layer-name">ESGOTO (Mapa de Calor)</span>
						<span class="layer-color" style="background: linear-gradient(90deg, rgba(0,100,255,0.5), rgba(255,255,0,0.7), rgba(255,0,0,0.8));"></span>
					</label>
					<label class="layer-item">
						<input type="checkbox" id="layer-bairros">
						<span class="layer-name">BAIRROS</span>
						<span class="layer-color" style="background-color: #ffeb3b;"></span>
					</label>
					<label class="layer-item">
						<input type="checkbox" id="layer-bacias">
						<span class="layer-name">BACIAS DE ABASTECIMENTO</span>
						<span class="layer-color" style="background-color: #00aacc;"></span>
					</label>
					<label class="layer-item">
						<input type="checkbox" id="layer-rede-agua">
						<span class="layer-name">REDE DE ÁGUA</span>
						<span class="layer-color" style="background-color: #0099ff;"></span>
					</label>
					<label class="layer-item">
						<input type="checkbox" id="layer-rede-esgoto">
						<span class="layer-name">REDE DE ESGOTO</span>
						<span class="layer-color" style="background-color: #ff0000;"></span>
					</label>
				</div>
			</div>

		</div>
	</div>

	<!-- Mapa -->
	<div id="map" class="sidebar-collapsed"></div>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
	<script src="main.js?v=20260918heat"></script>
</body>
</html>
